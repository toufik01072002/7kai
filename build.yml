name: Build APK
on:
  workflow_dispatch:
  push:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Creer les fichiers du projet
        run: |
          cat > settings.gradle.kts <<'EOF_FILE'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositories { google(); mavenCentral() } }
          rootProject.name = "AppForgeMobile"
          include(":app")
          EOF_FILE
          cat > build.gradle.kts <<'EOF_FILE'
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          EOF_FILE
          cat > gradle.properties <<'EOF_FILE'
          org.gradle.jvmargs=-Xmx2g
          android.useAndroidX=true
          kotlin.code.style=official
          EOF_FILE
          mkdir -p app
          cat > app/build.gradle.kts <<'EOF_FILE'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }
          android {
              namespace = "com.appforge.mobile"
              compileSdk = 34
              defaultConfig {
                  applicationId = "com.appforge.mobile"
                  minSdk = 24
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1.0"
              }
              buildTypes { release { isMinifyEnabled = false } }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = "17" }
              buildFeatures { compose = true }
              composeOptions { kotlinCompilerExtensionVersion = "1.5.14" }
          }
          dependencies {
              val bom = platform("androidx.compose:compose-bom:2024.06.00")
              implementation(bom)
              implementation("androidx.activity:activity-compose:1.9.0")
              implementation("androidx.compose.material3:material3")
              implementation("androidx.compose.ui:ui")
              implementation("org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1")
          }
          EOF_FILE
          mkdir -p app/src/main
          cat > app/src/main/AndroidManifest.xml <<'EOF_FILE'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <application
                  android:label="AppForge"
                  android:usesCleartextTraffic="true"
                  android:theme="@android:style/Theme.Material.Light.NoActionBar">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF_FILE
          mkdir -p app/src/main/java/com/appforge/mobile
          cat > app/src/main/java/com/appforge/mobile/MainActivity.kt <<'EOF_FILE'
          package com.appforge.mobile

          import android.content.Intent
          import android.net.Uri
          import android.os.Bundle
          import androidx.activity.ComponentActivity
          import androidx.activity.compose.setContent
          import androidx.compose.foundation.layout.*
          import androidx.compose.foundation.rememberScrollState
          import androidx.compose.foundation.verticalScroll
          import androidx.compose.material3.*
          import androidx.compose.runtime.*
          import androidx.compose.ui.Alignment
          import androidx.compose.ui.Modifier
          import androidx.compose.ui.platform.LocalContext
          import androidx.compose.ui.unit.dp
          import kotlinx.coroutines.Dispatchers
          import kotlinx.coroutines.delay
          import kotlinx.coroutines.launch
          import kotlinx.coroutines.withContext
          import org.json.JSONArray
          import org.json.JSONObject
          import java.net.HttpURLConnection
          import java.net.URL

          class MainActivity : ComponentActivity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  setContent { MaterialTheme { Surface(Modifier.fillMaxSize()) { ForgeScreen() } } }
              }
          }

          private val TARGETS = linkedMapOf(
              "Android" to "android", "Windows" to "windows", "Linux" to "linux", "Enigma 2" to "enigma2"
          )

          private fun http(method: String, url: String, body: String? = null): String {
              val c = URL(url).openConnection() as HttpURLConnection
              c.requestMethod = method
              c.connectTimeout = 15000
              c.readTimeout = 30000
              if (body != null) {
                  c.doOutput = true
                  c.setRequestProperty("Content-Type", "application/json")
                  c.outputStream.use { it.write(body.toByteArray()) }
              }
              val stream = if (c.responseCode < 400) c.inputStream else c.errorStream
              val text = stream.bufferedReader().readText()
              if (c.responseCode >= 400) error("HTTP ${c.responseCode}: $text")
              return text
          }

          @Composable
          fun ForgeScreen() {
              val ctx = LocalContext.current
              val prefs = remember { ctx.getSharedPreferences("cfg", 0) }
              var server by remember { mutableStateOf(prefs.getString("server", "http://192.168.1.10:8000")!!) }
              var prompt by remember { mutableStateOf("") }
              val selected = remember { mutableStateMapOf("Android" to true) }
              var status by remember { mutableStateOf("Prêt.") }
              var busy by remember { mutableStateOf(false) }
              var links by remember { mutableStateOf(listOf<Pair<String, String>>()) }
              val scope = rememberCoroutineScope()

              Column(
                  Modifier.fillMaxSize().verticalScroll(rememberScrollState()).padding(16.dp).statusBarsPadding(),
                  verticalArrangement = Arrangement.spacedBy(12.dp)
              ) {
                  Text("AppForge", style = MaterialTheme.typography.headlineMedium)
                  OutlinedTextField(
                      value = server, onValueChange = { server = it; prefs.edit().putString("server", it).apply() },
                      label = { Text("URL du serveur de build") }, singleLine = true, modifier = Modifier.fillMaxWidth()
                  )
                  OutlinedTextField(
                      value = prompt, onValueChange = { prompt = it },
                      label = { Text("Décris ton application") }, minLines = 4, modifier = Modifier.fillMaxWidth()
                  )
                  Text("Plateformes cibles", style = MaterialTheme.typography.titleSmall)
                  TARGETS.keys.forEach { name ->
                      Row(verticalAlignment = Alignment.CenterVertically) {
                          Checkbox(checked = selected[name] == true, onCheckedChange = { selected[name] = it })
                          Text(name)
                      }
                  }
                  Button(
                      enabled = !busy && prompt.isNotBlank() && selected.any { it.value },
                      modifier = Modifier.fillMaxWidth(),
                      onClick = {
                          busy = true; links = emptyList()
                          scope.launch {
                              try {
                                  val base = server.trimEnd('/')
                                  val body = JSONObject()
                                      .put("prompt", prompt)
                                      .put("targets", JSONArray(selected.filter { it.value }.keys.map { TARGETS[it] }))
                                      .toString()
                                  status = "Envoi de la demande…"
                                  val id = withContext(Dispatchers.IO) {
                                      JSONObject(http("POST", "$base/projects", body)).getString("id")
                                  }
                                  repeat(300) {
                                      val r = withContext(Dispatchers.IO) { JSONObject(http("GET", "$base/projects/$id")) }
                                      val st = r.optString("status")
                                      status = "$st — ${r.optString("step")}"
                                      if (st == "done") {
                                          val arr = r.optJSONArray("artifacts") ?: JSONArray()
                                          links = (0 until arr.length()).map {
                                              val o = arr.getJSONObject(it)
                                              o.getString("target") to (base + o.getString("url"))
                                          }
                                          return@launch
                                      }
                                      if (st == "failed") { status = "Échec : ${r.optString("error")}"; return@launch }
                                      delay(3000)
                                  }
                                  status = "Délai dépassé."
                              } catch (e: Exception) {
                                  status = "Erreur : ${e.message}"
                              } finally { busy = false }
                          }
                      }
                  ) { Text(if (busy) "Génération en cours…" else "Générer") }

                  if (busy) LinearProgressIndicator(Modifier.fillMaxWidth())
                  Text(status)
                  links.forEach { (target, url) ->
                      OutlinedButton(
                          modifier = Modifier.fillMaxWidth(),
                          onClick = { ctx.startActivity(Intent(Intent.ACTION_VIEW, Uri.parse(url))) }
                      ) { Text("Télécharger : $target") }
                  }
              }
          }
          EOF_FILE
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.7" }
      - run: gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: AppForge-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
